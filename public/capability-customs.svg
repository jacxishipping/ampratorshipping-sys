<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="customs-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F9FAFB" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.05" />
    </filter>
    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#customs-bg)" />

  <!-- Abstract Biometric/Data Rings -->
  <g transform="translate(800, 500)" stroke="#111827" fill="none">
    <circle cx="0" cy="0" r="280" stroke-width="1" stroke-dasharray="2 10" opacity="0.1">
       <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="320" stroke-width="2" stroke-dasharray="50 150 20 80" opacity="0.15">
       <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="360" stroke-width="3" stroke-dasharray="200 400" stroke="#D4AF37" opacity="0.3">
       <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Massive glowing security shield background -->
  <g transform="translate(800, 500)" fill="#FFFFFF" filter="url(#soft-shadow)">
    <path d="M 0,-400 L 350,-200 L 350,150 C 350,300 0,450 0,450 C 0,450 -350,300 -350,150 L -350,-200 Z" stroke="#E5E7EB" stroke-width="5" />
    <path d="M 0,-350 L 300,-170 L 300,130 C 300,260 0,390 0,390 C 0,390 -300,260 -300,130 L -300,-170 Z" fill="#F9FAFB" stroke="#D4AF37" stroke-width="3" />
  </g>

  <!-- Scanning laser array sweeping across -->
  <g>
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#D4AF37" stroke-width="4" opacity="0.6" filter="url(#blur-shadow)">
      <animate attributeName="y1" values="-100; 1100; -100" dur="6s" repeatCount="indefinite" ease="linear"/>
      <animate attributeName="y2" values="-100; 1100; -100" dur="6s" repeatCount="indefinite" ease="linear"/>
    </line>
    <rect x="0" y="200" width="1600" height="150" fill="#D4AF37" opacity="0.05">
      <animate attributeName="y" values="-100; 1100; -100" dur="6s" repeatCount="indefinite" ease="linear"/>
    </rect>
  </g>

  <!-- Checkmark / Verification Graphic -->
  <g transform="translate(800, 500)">
    <path d="M -100,20 L -30,80 L 120,-80" fill="none" stroke="#D4AF37" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)" />
    <path d="M -100,20 L -30,80 L 120,-80" fill="none" stroke="#B8860B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(100, 150)" opacity="0.8">
    <rect x="0" y="0" width="300" height="2" fill="#D4AF37" />
    <rect x="0" y="10" width="150" height="1" fill="#D4AF37" opacity="0.5"/>
    <rect x="0" y="20" width="200" height="1" fill="#111827" opacity="0.2"/>
    <text x="0" y="50" font-family="monospace" font-size="16" fill="#111827" font-weight="bold" letter-spacing="2">AUTHORIZATION: VERIFIED</text>
    <text x="0" y="80" font-family="monospace" font-size="14" fill="#6B7280" letter-spacing="1">CLEARANCE CODE: ALPHA-99</text>
  </g>
</svg>
