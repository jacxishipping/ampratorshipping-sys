<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9FAFB" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.05" />
    </filter>
    <filter id="water-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#ocean-bg)" />
  
  <g filter="url(#water-noise)" opacity="0.4">
    <path d="M -200,300 C 400,200 800,400 1800,300" fill="none" stroke="#D1D5DB" stroke-width="1" />
    <path d="M -200,350 C 400,250 800,450 1800,350" fill="none" stroke="#D4AF37" stroke-width="1" />
    <path d="M -200,400 C 400,300 800,500 1800,400" fill="none" stroke="#D1D5DB" stroke-width="1.5" />
    <path d="M -200,450 C 400,350 800,550 1800,450" fill="none" stroke="#D4AF37" stroke-width="2" />
    <path d="M -200,500 C 400,400 800,600 1800,500" fill="none" stroke="#B8860B" stroke-width="3" filter="url(#soft-shadow)" />
    <path d="M -200,550 C 400,450 800,650 1800,550" fill="none" stroke="#D4AF37" stroke-width="2" />
    <path d="M -200,600 C 400,500 800,700 1800,600" fill="none" stroke="#D1D5DB" stroke-width="1.5" />
    <path d="M -200,650 C 400,550 800,750 1800,650" fill="none" stroke="#D4AF37" stroke-width="1" />
    <path d="M -200,700 C 400,600 800,800 1800,700" fill="none" stroke="#D1D5DB" stroke-width="0.5" />
  </g>

  <!-- Clean Abstract Ship / Arrowhead -->
  <g transform="translate(800, 480)" filter="url(#soft-shadow)">
    <path d="M -300,-100 L 0,-50 L 300,0 L 0,50 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -250,-80 L 0,-40 L 220,0 L 0,40 Z" fill="#F9FAFB" stroke="#D4AF37" stroke-width="1"/>
    <path d="M -200,-60 L 0,-30 L 140,0 L 0,30 Z" fill="#F3F4F6" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="600" y2="0" stroke="#111827" stroke-width="3" stroke-dasharray="10 30" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0; -400" dur="5s" repeatCount="indefinite" />
    </line>
    <circle cx="300" cy="0" r="5" fill="#111827" />
  </g>

  <!-- Navigational Compass Background -->
  <g transform="translate(1300, 250)" opacity="0.3">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="8 12" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#D1D5DB" stroke-width="1" />
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#D4AF37" stroke-width="1.5" />
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#D4AF37" stroke-width="1.5" />
    <line x1="-120" y1="-120" x2="120" y2="120" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="-120" y1="120" x2="120" y2="-120" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <g transform="translate(200, 800)" opacity="0.4">
    <text font-family="monospace" font-size="24" fill="#111827" letter-spacing="4">N 45° 58' 23.0" W 64° 12' 4.0"</text>
    <text font-family="monospace" font-size="14" fill="#D4AF37" letter-spacing="2" y="24" font-weight="bold">MARITIME LOGISTICS // SYNC</text>
  </g>

</svg>
